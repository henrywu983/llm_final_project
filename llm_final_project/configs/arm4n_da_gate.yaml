# Arm 4n: our difficulty-aware gate (arm 4) with scale_rewards: none.
# Identical to arm4_da_gate.yaml except that GRPO no longer divides each question's
# advantages by the std of its 8 rewards. Tests whether that division ("zoom")
# causes the length collapse: on all-correct questions the tiny length
# differences were stretched to the size of right-vs-wrong.
inherit: arm4_da_gate.yaml

experiment:
  name: arm4n_da_gate

grpo:
  scale_rewards: none
