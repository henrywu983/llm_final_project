# Arm 5n: DDCA-inspired scaled penalty (arm 5) with scale_rewards: none.
# Identical to arm5_ddca_scaled.yaml except that GRPO no longer divides each question's
# advantages by the std of its 8 rewards. Tests whether that division ("zoom")
# causes the length collapse: on all-correct questions the tiny length
# differences were stretched to the size of right-vs-wrong.
inherit: arm5_ddca_scaled.yaml

experiment:
  name: arm5n_ddca_scaled

grpo:
  scale_rewards: none
